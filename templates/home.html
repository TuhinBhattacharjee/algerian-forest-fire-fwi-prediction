<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FWI Prediction</title>

    <style>
        body {
            margin: 8px;
            background-color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-family: "Times New Roman", Times, serif;
            font-size: 50px;
            margin-top: 10px;
            margin-bottom: 55px;
        }

        .form-container {
            width: 340px;
        }

        input {
            display: block;
            width: 340px;
            height: 45px;
            box-sizing: border-box;

            font-size: 28px;
            padding-left: 7px;

            border: 2px solid #777;
            border-radius: 5px;
            margin: 0;
        }

        input::placeholder {
            color: #666;
            opacity: 1;
        }

        button {
            font-size: 22px;
            padding: 5px 14px;
            margin-top: 0;

            background-color: #f5f5f5;
            border: 2px solid #777;
            border-radius: 5px;

            cursor: pointer;
        }

        button:hover {
            background-color: #e5e5e5;
        }

        .result {
            font-family: "Times New Roman", Times, serif;
            font-size: 25px;
            margin-top: 55px;
        }
    </style>
</head>

<body>

    <h1>FWI Prediction</h1>

    <div class="form-container">

        <form action="{{ url_for('predict_datapoint') }}" method="POST">

            <input
                type="number"
                step="any"
                name="Temperature"
                placeholder="Temperature"
                required
            >

            <input
                type="number"
                step="any"
                name="RH"
                placeholder="RH"
                required
            >

            <input
                type="number"
                step="any"
                name="Ws"
                placeholder="Ws"
                required
            >

            <input
                type="number"
                step="any"
                name="Rain"
                placeholder="Rain"
                required
            >

            <input
                type="number"
                step="any"
                name="FFMC"
                placeholder="FFMC"
                required
            >

            <input
                type="number"
                step="any"
                name="DMC"
                placeholder="DMC"
                required
            >

            <input
                type="number"
                step="any"
                name="ISI"
                placeholder="ISI"
                required
            >

            <input
                type="number"
                step="any"
                name="Classes"
                placeholder="Classes"
                required
            >

            <input
                type="number"
                step="any"
                name="Region"
                placeholder="Region"
                required
            >

            <button type="submit">Predict</button>

        </form>

    </div>

    {% if results is not none %}
        <h1 class="result">
            THE FWI prediction is {{ results }}
        </h1>
    {% else %}
        <h1 class="result">
            THE FWI prediction is
        </h1>
    {% endif %}

</body>

</html>
